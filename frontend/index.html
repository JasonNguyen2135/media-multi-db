<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <nav class="flex items-center justify-between flex-wrap bg-teal-500 p-6">
        <div class="flex items-center flex-shrink-0 text-white mr-6">
            <span class="font-semibold text-xl tracking-tight">Polyglot Blog</span>
        </div>
        <div class="w-full block flex-grow lg:flex lg:items-center lg:w-auto">
            <div class="text-sm lg:flex-grow">
                <a href="/index.html" class="block mt-4 lg:inline-block lg:mt-0 text-teal-200 hover:text-white mr-4">Home</a>
                <a href="/editor.html" class="block mt-4 lg:inline-block lg:mt-0 text-teal-200 hover:text-white mr-4">Write Article</a>
            </div>
            <div id="user-info">
                <a href="/login.html" class="inline-block text-sm px-4 py-2 leading-none border rounded text-white border-white hover:border-transparent hover:text-teal-500 hover:bg-white mt-4 lg:mt-0">Login / Register</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 flex px-4 gap-8">
        <!-- Main Content -->
        <div class="w-2/3">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Latest Articles</h1>
                <div>
                    <input type="text" id="search-input" placeholder="Search articles..." class="border rounded px-4 py-2 text-gray-700 focus:outline-none focus:border-teal-500">
                    <button onclick="searchArticles()" class="bg-teal-500 text-white px-4 py-2 rounded">Search</button>
                </div>
            </div>
            
            <div id="articles-container" class="space-y-6">
                <!-- Articles will be loaded here via JS -->
            </div>
        </div>

        <!-- Sidebar -->
        <div class="w-1/3">
            <div class="bg-white p-6 rounded shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Trending</h2>
                <ul id="trending-container" class="space-y-3">
                    <li class="text-gray-600 text-sm italic">Trending articles will be populated by Redis...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Article Modal -->
    <div id="article-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-8 border w-3/4 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-start">
                <h3 id="modal-title" class="text-3xl font-bold text-gray-900 mb-4"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-500">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="text-sm text-gray-500 mb-6 flex gap-4">
                <span id="modal-author"></span>
                <span>•</span>
                <span id="modal-views" class="text-teal-600 font-semibold"></span>
            </div>
            <div id="modal-content" class="text-gray-700 text-lg leading-relaxed whitespace-pre-wrap"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadArticles();
        });
    </script>
</body>
</html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------
    # Proxy /api/* → Internal ELB (IP của ELB backend)
    # BACKEND_URL được inject từ env var lúc container start
    # Ví dụ: BACKEND_URL=http://10.0.2.100:8000
    # -----------------------------------------------
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;

        # Forward headers để backend biết request thật sự từ đâu
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout hợp lý cho upload ảnh lớn
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Tắt buffering để stream response ngay
        proxy_buffering off;
    }

    # -----------------------------------------------
    # Serve static files HTML/JS
    # -----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # -----------------------------------------------
    # Health check endpoint cho ELB
    # -----------------------------------------------
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Ẩn version nginx
    server_tokens off;
}

version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: prod_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  postgres-db:
    image: postgres:15-alpine
    container_name: prod_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_DB: articles_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  mongo-db:
    image: mongo:6.0
    container_name: prod_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpassword}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis-db:
    image: redis:7-alpine
    container_name: prod_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    image: polyglot-backend:latest
    container_name: prod_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql-db
      - postgres-db
      - mongo-db
      - redis-db
    environment:
      - PYTHONUNBUFFERED=1
      # Vì DB và Backend chạy cùng 1 máy (cùng docker network), Backend dùng thẳng DNS nội bộ của Docker
      - MYSQL_URL=mysql+pymysql://root:${MYSQL_PASSWORD:-rootpassword}@mysql-db:3306/auth_db
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rootpassword}@postgres-db:5432/articles_db
      - MONGO_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-rootpassword}@mongo-db:27017
      - REDIS_URL=redis://redis-db:6379/0

volumes:
  mysql_data:
  postgres_data:
  mongo_data:

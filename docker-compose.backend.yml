version: '3.8'
services:
  backend:
    image: ${REGISTRY}/media-backend:${TAG}
    container_name: prod_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # DB giờ nằm trên DBaaS CMC Cloud, không còn chạy Docker nữa
      - MYSQL_URL=${MYSQL_URL}
      - POSTGRES_URL=${POSTGRES_URL}
      - MONGO_URL=${MONGO_URL}
      - REDIS_URL=${REDIS_URL}

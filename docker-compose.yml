version: '3.8'

services:
  # --- DATABASES ---
  mysql-db:
    image: mysql:8.0
    container_name: polyglot_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15-alpine
    container_name: polyglot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: articles_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo-db:
    image: mongo:6.0
    container_name: polyglot_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis-db:
    image: redis:7-alpine
    container_name: polyglot_redis
    ports:
      - "6379:6379"

  # --- BACKEND ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: polyglot_backend
    ports:
      - "8000:8000"
    depends_on:
      - mysql-db
      - postgres-db
      - mongo-db
      - redis-db
    environment:
      # We override the localhost URLs here using environment variables if we wanted to,
      # but in this case I will update the python code to use these service names.
      - PYTHONUNBUFFERED=1

  # --- FRONTEND ---
  frontend:
    image: nginx:alpine
    container_name: polyglot_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mysql_data:
  postgres_data:
  mongo_data:

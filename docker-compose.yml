version: '3.8'

services:
  # --- DATABASES ---
  mysql-db:
    image: mysql:8.0
    container_name: polyglot_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15-alpine
    container_name: polyglot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: articles_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo-db:
    image: mongo:6.0
    container_name: polyglot_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis-db:
    image: redis:7-alpine
    container_name: polyglot_redis
    ports:
      - "6379:6379"

  # --- BACKEND ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: polyglot_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql-db
      - postgres-db
      - mongo-db
      - redis-db
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_URL=mysql+pymysql://root:rootpassword@mysql-db:3306/auth_db
      - POSTGRES_URL=postgresql://postgres:rootpassword@postgres-db:5432/articles_db
      - MONGO_URL=mongodb://admin:rootpassword@mongo-db:27017
      - REDIS_URL=redis://redis-db:6379/0

  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polyglot_frontend
    ports:
      - "80:80"  # Chạy port 80 để api.js dùng '/api' (qua Nginx proxy)
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
